image:
  repository: harbor.efda.gov.et/apps/kpi
  tag: "3be3951d" # placeholder — Image Updater writes the real 8-char sha back
  pullPolicy: Always
namespace: staging
host: kpi.stage.eaii.efda.gov.et
port: 3000
# NEXT_PUBLIC_* config is baked at image build time (see Dockerfile ARGs) —
# runtime env here only controls the Node server itself.
env:
  PORT: "3000"
  NEXT_PUBLIC_STS_AUTHORITY: "https://eris-identity.stage.eaii.efda.gov.et"
  NEXT_PUBLIC_CLIENT_ID: "eris-kpi"
  NEXT_PUBLIC_CLIENT_ROOT: "https://kpi.stage.eaii.efda.gov.et/"
  NEXT_PUBLIC_REDIRECT_URI: "https://kpi.stage.eaii.efda.gov.et/auth-callback?to=signin"
  NEXT_PUBLIC_SILENT_REDIRECT_URI: "https://kpi.stage.eaii.efda.gov.et/assets/silent-callback.html"
  NEXT_PUBLIC_POST_LOGOUT_REDIRECT_URI: "https://kpi.stage.eaii.efda.gov.et"
  NEXT_PUBLIC_RESPONSE_TYPE: "code"
  NEXT_PUBLIC_CLIENT_SCOPE: "openid profile email"
  NEXT_PUBLIC_API_ROOT: "https://facilityregistry-be.stage.eaii.efda.gov.et"
  NEXT_PUBLIC_API_KPI: "https://eris-be.stage.eaii.efda.gov.et"
secrets: []
resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "256Mi"
    cpu: "100m"
replicas: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 80
