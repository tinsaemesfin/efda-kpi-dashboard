workflow:
  rules:
    # Image Updater write-back commits are authored by the bot; skip their pipelines so the
    # tag bump doesn't rebuild (prevents the write-back loop WITHOUT a [skip ci] in the message,
    # which was leaking into developer merge commits and skipping real builds).
    - if: '$CI_COMMIT_AUTHOR =~ /argocd-image-updater/'
      when: never
    - when: always

stages:
  - build

variables:
  HARBOR_REGISTRY: harbor.efda.gov.et
  HARBOR_PROJECT: apps
  IMAGE: $HARBOR_REGISTRY/$HARBOR_PROJECT/$CI_PROJECT_NAME

# NEXT_PUBLIC_* runtime config is baked into the bundle at build time; staging
# defaults live as ARG defaults in the Dockerfile. A prod job should override
# them with --build-arg.
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  rules:
    # NEXT_PUBLIC_* is baked into the bundle at build time, so each branch bakes
    # its own environment's URLs. Staging values match the Dockerfile ARG defaults.
    - if: '$CI_COMMIT_BRANCH == "feature/eaii-staging"'
      variables:
        TAG_PREFIX: ""
        STS_AUTHORITY: "https://eris-identity.stage.eaii.efda.gov.et"
        CLIENT_ROOT: "https://kpi.stage.eaii.efda.gov.et"
        API_ROOT: "https://facilityregistry-be.stage.eaii.efda.gov.et"
        API_KPI: "https://eris-be.stage.eaii.efda.gov.et"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        TAG_PREFIX: "main-"
        STS_AUTHORITY: "https://id.eris.efda.gov.et"
        CLIENT_ROOT: "https://kpi.efda.gov.et"
        API_ROOT: "https://ilicense.api.efda.gov.et"
        API_KPI: "https://api.eris.efda.gov.et"
    - when: never
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USER\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile $CI_PROJECT_DIR/Dockerfile
        --target production
        --build-arg "NEXT_PUBLIC_STS_AUTHORITY=$STS_AUTHORITY"
        --build-arg "NEXT_PUBLIC_CLIENT_ROOT=$CLIENT_ROOT/"
        --build-arg "NEXT_PUBLIC_REDIRECT_URI=$CLIENT_ROOT/auth-callback?to=signin"
        --build-arg "NEXT_PUBLIC_SILENT_REDIRECT_URI=$CLIENT_ROOT/assets/silent-callback.html"
        --build-arg "NEXT_PUBLIC_POST_LOGOUT_REDIRECT_URI=$CLIENT_ROOT"
        --build-arg "NEXT_PUBLIC_API_ROOT=$API_ROOT"
        --build-arg "NEXT_PUBLIC_API_KPI=$API_KPI"
        --destination $IMAGE:${TAG_PREFIX}$CI_COMMIT_SHORT_SHA
        --destination $IMAGE:${TAG_PREFIX}latest
        --snapshotMode=redo
        --registry-map "mcr.microsoft.com=harbor.efda.gov.et/mcr;index.docker.io=harbor.efda.gov.et/dockerhub"
        --compressed-caching=false
